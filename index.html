<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#F6F3EA">
<title>口袋地圖 Pocket Pins — 一鍵把好店釘起來</title>
<meta name="description" content="看到好店，打開地圖釘一下就記下來：分類、筆記、導航，不用貼網址；登入 Google 還能雲端同步，換手機資料也跟著走。">
<link rel="icon" type="image/png" href="logo.png">
<meta property="og:title" content="口袋地圖 Pocket Pins — 一鍵把好店釘起來">
<meta property="og:description" content="不用貼網址：打開地圖直接釘，記錄、分類、導航；登入 Google 雲端同步，換手機資料也不會掉。">
<meta property="og:image" content="https://f60331123.github.io/pocket-map/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@600;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
:root{
  --paper:#F4F2EA;
  --card:#FFFFFF;
  --ink:#23281F;
  --ink2:#6E7466;
  --line:#E0DCCC;
  --red:#E2452C;
  --red-d:#C43720;
  --green:#1F4D3F;
  --gold:#E9A319;
  --shadow:0 12px 32px rgba(35,40,31,.12);
  --r:18px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Noto Sans TC',system-ui,-apple-system,sans-serif;
  background:var(--paper);color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid rgba(226,69,44,.45);outline-offset:2px;border-radius:8px}
.hide{display:none!important}
.serif{font-family:'Noto Serif TC',serif}

/* ============ 登入頁 ============ */
#login{
  min-height:100dvh;display:flex;align-items:center;justify-content:center;
  padding:24px;position:relative;overflow:hidden;
  background:
    radial-gradient(rgba(35,40,31,.06) 1.2px, transparent 1.2px) 0 0/26px 26px,
    linear-gradient(160deg,#F6F4EC 0%,#EFEDE2 100%);
}
#login .deco{position:absolute;inset:0;pointer-events:none;opacity:.9}
#login .card{
  position:relative;width:min(430px,100%);
  background:var(--card);border:1px solid var(--line);border-radius:26px;
  box-shadow:var(--shadow);padding:40px 34px 30px;text-align:center;
}
#login .logoPin{width:74px;height:74px;margin:0 auto 6px;animation:drop .7s cubic-bezier(.2,.9,.3,1.4) both}
@keyframes drop{0%{transform:translateY(-46px) scale(1.15);opacity:0}100%{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){#login .logoPin{animation:none}}
#login h1{font-family:'Noto Serif TC',serif;font-weight:900;font-size:34px;letter-spacing:.04em}
#login .sub{color:var(--ink2);margin-top:6px;font-size:15px}
#login .demo-note{
  margin:18px 0 0;padding:10px 12px;font-size:12.5px;line-height:1.6;color:var(--ink2);
  background:#F6F3E8;border:1px dashed var(--line);border-radius:12px;text-align:left;
}
.gbtn{
  margin-top:22px;width:100%;display:flex;align-items:center;justify-content:center;gap:12px;
  background:#fff;border:1px solid #DAD5C6;border-radius:999px;padding:13px 18px;
  font-weight:700;font-size:16px;box-shadow:0 2px 8px rgba(35,40,31,.08);
  transition:transform .15s ease, box-shadow .15s ease;
}
.gbtn:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(35,40,31,.14)}
.gbtn svg{width:20px;height:20px}
.linkish{margin-top:14px;font-size:14px;color:var(--ink2);text-decoration:underline;text-underline-offset:3px}

/* ============ App 殼 ============ */
#app{height:100dvh;display:flex;flex-direction:column;overflow:hidden}
header{
  display:flex;align-items:center;gap:14px;padding:10px 16px;
  background:var(--card);border-bottom:1px solid var(--line);z-index:1100;
;padding-top:env(safe-area-inset-top)}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.brand svg{width:26px;height:26px;flex:none}
.brand b{font-family:'Noto Serif TC',serif;font-weight:900;font-size:19px;letter-spacing:.03em;white-space:nowrap}
.brand span{font-size:10.5px;color:var(--ink2);letter-spacing:.14em;text-transform:uppercase;display:block;margin-top:-2px}
.tabs{display:flex;background:#EFEDE1;border-radius:999px;padding:4px;margin-left:4px}
.tabs button{padding:7px 18px;border-radius:999px;font-weight:700;font-size:14.5px;color:var(--ink2)}
.tabs button.on{background:var(--ink);color:#fff}
.me{margin-left:auto;display:flex;align-items:center;gap:10px}
.shareBtn{
  display:flex;align-items:center;gap:7px;font-weight:700;font-size:14px;
  border:1.5px solid var(--ink);border-radius:999px;padding:7px 15px;background:#fff;
  transition:background .15s;
}
.shareBtn:hover{background:var(--ink);color:#fff}
.avatar{
  width:38px;height:38px;border-radius:50%;background:var(--green);color:#fff;
  font-weight:900;font-size:16px;display:flex;align-items:center;justify-content:center;position:relative;
  overflow:hidden;flex:none;
}
.avatar.out{background:#C9C5B6}
.avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.avPen{position:absolute;right:-3px;bottom:-3px;width:15px;height:15px;border-radius:50%;background:#fff;border:1px solid #A9A596;box-shadow:0 1px 3px rgba(0,0,0,.18);pointer-events:auto;display:flex;align-items:center;justify-content:center}
.avPen::after{content:'';width:8px;height:8px;background:#6E6A5C;clip-path:polygon(0 65%,10 100%,35 90%,95 30%,70 5%,10 65%)}
.menu{
  position:absolute;right:0;top:46px;background:#fff;border:1px solid var(--line);
  border-radius:12px;box-shadow:var(--shadow);padding:6px;min-width:130px;z-index:1200;
}
.menu button{width:100%;text-align:left;padding:9px 12px;border-radius:8px;font-size:14px}
.menu button:hover{background:#F3F1E7}

/* ============ 篩選列 ============ */
#chipbar{
  display:flex;align-items:center;gap:12px;padding:9px 16px;flex-wrap:wrap;
  background:var(--card);border-bottom:1px solid var(--line);z-index:1000;
}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip,.catChip{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.chip.armed,.catChip.armed{transform:scale(1.04)}
.chip.dragging,.catChip.dragging{opacity:.9;box-shadow:0 6px 16px rgba(35,40,31,.28);transform:scale(1.07);z-index:5;position:relative}
#chipEditOverlay{position:fixed;inset:0;background:rgba(30,32,26,.45);z-index:3000;display:flex;align-items:flex-end;justify-content:center}
#chipEditOverlay .ceCard{background:#fff;border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));width:100%;max-width:420px;box-shadow:0 -8px 30px rgba(0,0,0,.2)}
@media(min-width:641px){#chipEditOverlay{align-items:flex-end}#chipEditOverlay .ceCard{border-radius:16px 16px 0 0;max-width:460px}}
#chipEditOverlay h4{margin:0 0 10px;font-size:15px}
#chipEditOverlay .ceRow{display:flex;gap:8px;margin-top:10px;align-items:center}
#chipEditOverlay .ceBtns{display:flex;gap:8px;margin-top:14px}
#chipEditOverlay .ceBtns button{flex:1;padding:10px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font:inherit;font-size:14px;cursor:pointer}
#chipEditOverlay .ceBtns .danger{color:#B3351E;border-color:#E5C9C2}
#chipEditOverlay .ceBtns .primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip{
  display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:500;color:var(--ink2);
  border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 13px;
  transition:all .15s;
  white-space:nowrap;flex:0 0 auto;
}
.chip .dot{width:9px;height:9px;border-radius:50%;background:var(--c,#999)}
.chip.on{border-color:var(--ink);color:var(--ink);background:#FBF9F1;box-shadow:0 1px 0 rgba(35,40,31,.08)}
#chipbar .right{margin-left:auto;display:flex;align-items:center;gap:12px}
#stats{font-size:12.5px;color:var(--ink2);white-space:nowrap}
.seg{display:flex;background:#EFEDE1;border-radius:999px;padding:3px}
.seg button{padding:5px 13px;border-radius:999px;font-size:13px;font-weight:700;color:var(--ink2)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(35,40,31,.15)}

/* ============ 主內容 ============ */
main{flex:1;min-height:0;display:flex}
#mapView{flex:1;position:relative}
#map{position:absolute;inset:0;background:#E8E6DC}
#mapLegend{
  position:absolute;left:14px;bottom:16px;z-index:900;background:rgba(255,255,255,.94);
  border:1px solid var(--line);border-radius:14px;padding:10px 14px;font-size:12px;color:var(--ink2);
  box-shadow:0 4px 14px rgba(35,40,31,.12);line-height:1.9;max-width:190px;
}
#mapLegend b{color:var(--ink);font-size:12.5px}
.lgRow{display:flex;align-items:center;gap:7px}
.lgRow .dot{width:10px;height:10px;border-radius:50%;background:var(--c)}
.lgRow .ring{box-shadow:inset 0 0 0 2px var(--c);background:#fff}
.lgRow .pinMini{width:11px;height:11px;border-radius:50% 50% 50% 0;transform:rotate(-45deg)}
.mapFail{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  padding:30px;text-align:center;color:var(--ink2);font-size:14.5px;z-index:5;
}

#listView{flex:1;overflow:auto;padding:18px 16px 110px}
#listView .inner{max-width:940px;margin:0 auto}
#listView .cols{display:flex;gap:16px;align-items:flex-start}
#folderRail{flex:0 0 118px;position:sticky;top:10px;display:flex;flex-direction:column;gap:6px}
#folderRail .frTitle{font-size:11.5px;font-weight:700;color:var(--ink2);padding:2px 4px}
.geoEmpty{font-size:12px;color:var(--ink2);padding:8px 2px}
.suggHead{font-size:11px;color:var(--ink2);padding:6px 2px 0}
.suggRow{display:flex;gap:7px;align-items:flex-start;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12.5px;color:var(--ink);cursor:pointer;margin-top:6px;font-family:inherit}
.suggRow:hover{border-color:var(--ink)}
.frBtn{display:flex;align-items:center;gap:5px;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:7px 9px;font-size:12.5px;color:var(--ink);cursor:pointer;text-align:left;width:100%;box-sizing:border-box}
.frBtn.on{border-color:var(--ink);font-weight:700;background:#F4F2E9}
.frBtn .cnt{margin-left:auto;font-size:11px;color:var(--ink2)}
.frBtn .frDel{border:none;background:none;color:#C9AFA8;font-size:13px;cursor:pointer;padding:0 2px;line-height:1}
.frAdd{border:1.5px dashed var(--ink2);background:none;border-radius:10px;padding:6px 9px;font-size:12.5px;color:var(--ink2);cursor:pointer;text-align:left;width:100%}
.frNewRow{display:flex;gap:4px}
.frNewRow input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:10px;padding:6px 8px;font-size:12.5px;font-family:inherit}
.frNewRow button{border:1.5px solid var(--ink);background:var(--ink);color:#fff;border-radius:10px;padding:6px 8px;font-size:12px;cursor:pointer}
@media (max-width:640px){#listView .cols{flex-direction:column;gap:10px}#folderRail{position:static;flex:none;display:flex;flex-direction:row;overflow-x:auto;padding-bottom:4px;width:100%}#folderRail .frTitle{display:none}.frBtn{flex:0 0 auto;width:auto}.frAdd{flex:0 0 auto;width:auto}}
@media (max-width:640px){
  .txt{font-size:16px}
  .chip{padding:8px 14px}
  .seg button{padding:8px 14px}
}
#catChips{flex-wrap:wrap}
@media (max-width:640px){#catChips{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}}
#catChips::-webkit-scrollbar{display:none}
#catChips .chip{flex-direction:column;align-items:center;gap:4px;padding:7px 12px 8px;font-size:12.5px}
#bmChips{flex-wrap:wrap;margin:0 0 12px}
@media (max-width:640px){#bmChips{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}}
#bmChips::-webkit-scrollbar{display:none}
.chip .cnt{margin-left:2px;font-size:11px;color:var(--ink2);font-weight:400}
.bmDel{margin-left:4px;color:#C9AFA8;font-weight:700;padding:0 2px}
button,input,textarea,select{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#q{
  width:100%;padding:13px 18px;border:1.5px solid var(--line);border-radius:999px;
  background:#fff;font-size:15px;margin-bottom:16px;
}
#cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.pcard{
  background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;
  box-shadow:0 3px 10px rgba(35,40,31,.06);cursor:pointer;text-align:left;
  display:flex;gap:13px;transition:transform .15s, box-shadow .15s;position:relative;
}
.pcard:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.thumb{
  width:56px;height:56px;border-radius:14px;flex:none;display:flex;align-items:center;justify-content:center;
  font-family:'Noto Serif TC',serif;font-weight:900;font-size:22px;color:#fff;overflow:hidden;
}
.thumb img{width:100%;height:100%;object-fit:cover}
.pcard h3{font-family:'Noto Serif TC',serif;font-size:16.5px;font-weight:900;line-height:1.35;
  display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.metaRow{display:flex;align-items:center;gap:7px;margin-top:5px;flex-wrap:wrap}
.badge{font-size:11px;font-weight:700;padding:2.5px 9px;border-radius:999px;color:#fff}
.badge.outline{background:#fff;color:var(--c);box-shadow:inset 0 0 0 1.5px var(--c)}
.stBadge{font-size:11px;font-weight:700;padding:2.5px 9px;border-radius:999px}
.stBadge.done{background:#E7F0E4;color:#33691E}
.stBadge.todo{background:#FDF3DC;color:#9A6A00}
.pcard .note{
  margin-top:7px;font-size:13px;color:var(--ink2);line-height:1.55;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.pcard .foot{margin-top:9px;display:flex;align-items:center;gap:9px;font-size:12px;color:var(--ink2)}
.hearts{display:flex;gap:1.5px}
.hearts svg{width:13px;height:13px}
.hearts .on{color:var(--red)}
.hearts .off{color:#D9D5C6}
.visIc{display:flex;align-items:center;gap:4px}
.visIc svg{width:13px;height:13px}
.host{font-size:11.5px;color:var(--ink2);word-break:break-all;margin-top:6px;
  display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.emptyBox{
  margin:40px auto;max-width:420px;text-align:center;padding:36px 26px;
  border:1.5px dashed var(--line);border-radius:22px;background:#FBFAF4;
}
.emptyBox h3{font-family:'Noto Serif TC',serif;font-size:20px;font-weight:900;margin:12px 0 6px}
.emptyBox p{color:var(--ink2);font-size:14px;line-height:1.7;margin-bottom:18px}
.demoBtn{
  background:var(--green);color:#fff;font-weight:700;border-radius:999px;padding:11px 22px;font-size:14.5px;
  transition:opacity .15s;
}
.demoBtn:hover{opacity:.88}

/* ============ FAB ============ */
#fab{
  position:fixed;right:22px;bottom:calc(22px + env(safe-area-inset-bottom));z-index:1200;
  background:var(--red);color:#fff;font-weight:900;font-size:16px;
  border-radius:999px;padding:15px 24px;box-shadow:0 10px 26px rgba(196,55,32,.45);
  display:flex;align-items:center;gap:8px;transition:transform .15s;
}
#fab:hover{transform:translateY(-2px) scale(1.02)}
#fab svg{width:17px;height:17px}

/* ============ 彈窗 ============ */
.overlay{
  position:fixed;inset:0;background:rgba(30,34,26,.45);z-index:1500;
  display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(2px);
}
@media (min-width:640px){.overlay{align-items:center;padding:24px}}
.sheet{
  width:min(620px,100%);max-height:92dvh;overflow:auto;background:#fff;
  border-radius:24px 24px 0 0;padding:22px 22px 30px;
}
@media (min-width:640px){.sheet{border-radius:24px}}
.sheetHead{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.sheetHead h2{font-family:'Noto Serif TC',serif;font-weight:900;font-size:21px;flex:1}
.xBtn{width:36px;height:36px;border-radius:50%;background:#F1EFE4;display:flex;align-items:center;justify-content:center}
.xBtn svg{width:15px;height:15px}
.modeTabs{display:flex;gap:8px;margin-bottom:16px}
.modeTabs button{
  flex:1;padding:10px;border:1.5px solid var(--line);border-radius:12px;font-weight:700;font-size:14px;color:var(--ink2);background:#fff;
}
.modeTabs button.on{border-color:var(--ink);background:#FBF9F1;color:var(--ink)}
label.lb{display:block;font-size:13px;font-weight:700;margin:15px 0 7px;color:var(--ink)}
.inRow{display:flex;gap:8px}
input.txt,textarea.txt,select.txt{
  width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;font-size:15px;background:#FCFBF6;
}
textarea.txt{min-height:74px;resize:vertical;line-height:1.6}
.miniBtn{
  flex:none;border:1.5px solid var(--line);border-radius:12px;padding:0 15px;font-weight:700;font-size:13.5px;background:#fff;white-space:nowrap;
}
.miniBtn:hover{background:#F4F2E8}
.urlHint{font-size:12.5px;line-height:1.6;margin-top:7px;border-radius:10px;padding:8px 12px;display:none}
.urlHint.ok{display:block;background:#EAF3E7;color:#33691E}
.urlHint.warn{display:block;background:#FDF3DC;color:#8A5E00}
.urlHint.err{display:block;background:#FBEAE6;color:#B3351E}
.geoList{border:1.5px solid var(--line);border-radius:12px;overflow:hidden;margin-top:8px;display:none}
.geoList.show{display:block}
.geoList button{display:block;width:100%;text-align:left;padding:10px 14px;font-size:13.5px;border-bottom:1px solid var(--line);background:#fff}
.geoList button:last-child{border-bottom:none}
.geoList button:hover{background:#F7F5EB}
.geoList small{color:var(--ink2);display:block;margin-top:2px;font-size:11.5px}
.catChips{display:flex;gap:8px;flex-wrap:wrap}
.catChip{
  display:flex;align-items:center;gap:7px;border:1.5px solid var(--line);border-radius:999px;
  padding:7px 14px;font-size:13.5px;font-weight:500;background:#fff;color:var(--ink2);
  white-space:nowrap;flex:0 0 auto;
}
.catChip .dot{width:10px;height:10px;border-radius:50%;background:var(--c)}
.catChip.on{border-color:var(--ink);background:#FBF9F1;color:var(--ink);box-shadow:0 1px 0 rgba(35,40,31,.08)}
#fCats .catChip{flex-direction:column;align-items:center;gap:4px;padding:7px 12px 8px;font-size:12.5px}
.segRow{display:flex;background:#EFEDE1;border-radius:999px;padding:4px;width:fit-content}
.segRow button{padding:8px 20px;border-radius:999px;font-weight:700;font-size:14px;color:var(--ink2)}
.segRow button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(35,40,31,.15)}
.heartPick{display:flex;gap:6px}
.heartPick button svg{width:27px;height:27px;color:#D9D5C6;transition:transform .1s}
.heartPick button.on svg{color:var(--red)}
.heartPick button:hover{transform:scale(1.12)}
.rowFlex{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.rowFlex>div{flex:1;min-width:140px}
.switchRow{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:18px;
  background:#F7F5EB;border-radius:14px;padding:13px 16px}
.switchRow .t b{font-size:14.5px;display:block}
.switchRow .t span{font-size:12.5px;color:var(--ink2)}
.switch{position:relative;width:50px;height:28px;flex:none}
.switch input{opacity:0;width:100%;height:100%;position:absolute;cursor:pointer;z-index:2;margin:0}
.switch .track{position:absolute;inset:0;background:#CFCBBB;border-radius:999px;transition:background .15s}
.switch .knob{
  position:absolute;top:3px;left:3px;width:22px;height:22px;background:#fff;border-radius:50%;
  box-shadow:0 1px 4px rgba(0,0,0,.25);transition:left .15s;
}
.switch input:checked ~ .track{background:var(--green)}
.switch input:checked ~ .knob{left:25px}
.saveBtn{
  margin-top:20px;width:100%;background:var(--red);color:#fff;font-weight:900;font-size:16.5px;
  border-radius:14px;padding:15px;transition:background .15s;
}
.saveBtn:hover{background:var(--red-d)}
.delBtn{
  margin-top:12px;width:100%;border:1.5px solid #E4C4BD;color:#B3351E;background:#fff;
  font-weight:700;font-size:14px;border-radius:12px;padding:12px;
}
.delBtn:hover{background:#FBEAE6}
.batchArea{width:100%;min-height:150px}
.batchHint{font-size:12.5px;color:var(--ink2);line-height:1.7;margin-top:8px}
.saveBtn.glow{animation:saveGlow 1.1s ease 2}
@keyframes saveGlow{0%,100%{box-shadow:none}45%{box-shadow:0 0 0 9px rgba(226,69,44,.3);transform:scale(1.015)}}

/* 地圖彈出票卡 */
.maplibregl-popup-content{border-radius:16px;box-shadow:0 12px 30px rgba(35,40,31,.22);padding:0;font-family:'Noto Sans TC',sans-serif;overscroll-behavior:contain}
.maplibregl-popup-close-button{font-size:20px;line-height:1;width:30px;height:30px;padding:0;color:var(--ink2)}
.pp{padding:14px 15px 12px;width:250px;box-sizing:border-box;display:flex;flex-direction:column;max-height:min(46vh,380px);max-height:min(46dvh,380px);overflow:hidden}
.pp-head{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.pp-head b{font-family:'Noto Serif TC',serif;font-size:15.5px;font-weight:900;flex-basis:100%}
.pp .catTag{display:flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;color:var(--ink2)}
.pp .catTag .dot{width:9px;height:9px;border-radius:50%;background:var(--c)}
.pp img{width:100%;height:86px;object-fit:cover;border-radius:10px;margin-top:9px}
.pp p{font-size:12.5px;color:var(--ink2);line-height:1.6;margin-top:8px}
.pp .pp-foot{
  margin-top:10px;padding-top:9px;border-top:1.5px dashed var(--line);
  display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--ink2);
}
.pp .pp-foot .grow{flex:1}
.pp .btn-s{
  font-size:12px;font-weight:700;border:1.5px solid var(--ink);border-radius:999px;padding:4.5px 13px;background:#fff;
}
.pp .btn-s.ghost{border-color:var(--line);color:var(--ink2)}
.pp .btn-s:hover{background:var(--ink);color:#fff}

/* 分享彈窗 */
.shareUrl{
  margin-top:14px;background:#F7F5EB;border:1.5px dashed var(--line);border-radius:12px;
  padding:13px 15px;font-size:14px;font-weight:700;word-break:break-all;color:var(--green);
}

/* ============ 管理分類與顏色 ============ */
.iconBtn{width:34px;height:34px;border:1.5px solid var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center;background:#fff;color:var(--ink2);flex:none}
.iconBtn:hover{color:var(--ink);background:#F4F2E8}
.iconBtn svg{width:16px;height:16px}
.cmRow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line)}
.cmName{font-size:14px;font-weight:500;min-width:0}
.cmCount{font-size:12px;color:var(--ink2);flex:none}
.cmBtn{font-size:12.5px;color:var(--ink2);border:1.5px solid var(--line);border-radius:8px;padding:5px 10px;background:#fff;flex:none}
.cmBtn:hover{color:var(--ink);background:#F4F2E8}
.swatch{width:30px;height:30px;border-radius:9px;border:2px solid #fff;box-shadow:0 0 0 1.5px var(--line);overflow:hidden;position:relative;flex:none;cursor:pointer}
.swatch input[type=color]{position:absolute;inset:-8px;width:calc(100% + 16px);height:calc(100% + 16px);border:none;padding:0;background:none;cursor:pointer}

/* 還沒定位提醒盒 */
#todoGeo{
  position:absolute;top:12px;left:12px;z-index:950;max-width:240px;
  background:rgba(255,255,255,.97);border:1px solid var(--line);border-radius:14px;
  box-shadow:0 6px 18px rgba(35,40,31,.14);padding:11px 13px;font-size:12.5px;
}
#todoGeo b{display:block;margin-bottom:6px;color:var(--ink)}
#todoGeo .tgRow{display:flex;width:100%;align-items:center;gap:6px;padding:5px 7px;border-radius:8px;text-align:left;color:var(--ink)}
#todoGeo .tgRow:hover{background:#F4F2E8}
#todoGeo .tgRow span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#todoGeo .tgRow em{color:var(--red);font-style:normal;flex:none;font-weight:700}
#todoGeo .tgMore{color:var(--ink2);margin-top:4px}

/* Toast */
#toast{
  position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:#fff;font-size:14px;font-weight:500;border-radius:999px;
  padding:11px 22px;opacity:0;pointer-events:none;transition:all .25s;z-index:2000;white-space:nowrap;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:640px){
  header{padding:9px 12px}
  .brand span{display:none}
  .shareBtn span{display:none}
  .shareBtn{padding:7px 11px}
  #chipbar{padding:8px 12px;gap:8px}
  #stats{display:none}
  #fab{right:16px;bottom:calc(18px + env(safe-area-inset-bottom));padding:14px 20px}
  #mapLegend{display:none}
}

#syncChip{width:9px;height:9px;border-radius:50%;background:#B9B5A4;flex:0 0 auto}
#syncChip.syncing{background:#E9A319;animation:pulse 1s infinite}
#syncChip.ok{background:#1F7A6B}#syncChip.err{background:#B3351E}
@keyframes pulse{50%{opacity:.35}}
.fieldWrap{position:relative;display:block}.clrBtn{position:absolute;right:8px;top:14px;width:26px;height:26px;border:none;border-radius:50%;background:rgba(0,0,0,.08);color:#6b665a;font-size:15px;line-height:1;cursor:pointer;padding:0;z-index:2}.clrBtn:active{background:rgba(0,0,0,.18)}.clrTa{top:18px}
</style>
</head>
<body>

<!-- ============ 登入 ============ -->
<div id="login">
  <svg class="deco" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <path d="M-40,640 C220,560 320,720 560,610 C800,500 860,660 1240,540" fill="none" stroke="#1F4D3F" stroke-opacity=".18" stroke-width="3" stroke-dasharray="2 12" stroke-linecap="round"/>
    <g opacity=".5" transform="translate(150,180)"><circle cx="0" cy="0" r="10" fill="#E2452C" opacity=".25"/></g>
    <g opacity=".5" transform="translate(1020,240)"><circle cx="0" cy="0" r="14" fill="#1F7A6B" opacity=".25"/></g>
    <g opacity=".5" transform="translate(940,640)"><circle cx="0" cy="0" r="9" fill="#E9A319" opacity=".3"/></g>
  </svg>
  <div class="card">
    <svg class="logoPin" viewBox="0 0 64 64" aria-hidden="true">
      <path d="M32 6C20.4 6 11 15.2 11 26.6 11 41.8 32 60 32 60s21-18.2 21-33.4C53 15.2 43.6 6 32 6z" fill="#E2452C"/>
      <circle cx="32" cy="26.5" r="8.2" fill="#fff"/>
    </svg>
    <h1>口袋地圖</h1>
    <div class="sub">看到好店，一鍵釘起來 — 貼上網址就幫你記錄、分類、標上地圖</div>
    <button class="gbtn" id="googleBtn">
      <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
      使用 Google 繼續
    </button>
    <button class="linkish" id="guestBtn">先逛逛（訪客模式）</button>
    <div class="demo-note">這是<b>示範原型</b>：Google 按鈕目前只是示意，資料只存在你的裝置上。真實版會接真正的 Google 登入與雲端同步。</div>
  </div>
</div>

<!-- ============ App ============ -->
<div id="app" class="hide">
  <header>
    <div class="brand">
      <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M32 6C20.4 6 11 15.2 11 26.6 11 41.8 32 60 32 60s21-18.2 21-33.4C53 15.2 43.6 6 32 6z" fill="#E2452C"/><circle cx="32" cy="26.5" r="8.2" fill="#fff"/></svg>
      <div><b>口袋地圖</b><span>Pocket Pins</span></div>
    </div>
    <nav class="tabs" id="viewTabs">
      <button data-view="map" class="on">地圖</button>
      <button data-view="list">清單</button>
    </nav>
    <div class="me">
      <button class="shareBtn" id="shareBtn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 0 20 15.3 15.3 0 0 1 0-20z"/></svg>
        <span>分享我的地圖</span>
      </button>
      <button class="avatar" id="avatarBtn" aria-label="帳號"></button>
      <span id="syncChip" class="syncChip hide" title="雲端同步狀態"></span>
    </div>
  </header>

  <div id="chipbar">
    <div class="chips" id="catChips"></div>
    <div class="right">
      <button class="iconBtn" id="manageBtn" title="管理分類與顏色" aria-label="管理分類與顏色"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21a9 9 0 1 1 9-9c0 2-1.4 3-3.2 3H16a2 2 0 0 0-1.6 3.2c.5.7.1 2.8-2.4 2.8z"/><circle cx="7.5" cy="11.5" r="1.1" fill="currentColor" stroke="none"/><circle cx="10" cy="7.3" r="1.1" fill="currentColor" stroke="none"/><circle cx="14.8" cy="7.3" r="1.1" fill="currentColor" stroke="none"/></svg></button>
      <span id="stats"></span>
      <div class="seg" id="statusSeg">
        <button data-s="all" class="on">全部</button>
        <button data-s="todo">還沒去</button>
        <button data-s="done">去過了</button>
      </div>
    </div>
  </div>

  <main>
    <section id="mapView">
      <div id="map"></div>
      <div id="mapLegend">
        <b>怎麼看圖釘</b>
        <div class="lgRow"><span class="dot pinMini" style="--c:#1F7A6B"></span>去過了</div>
        <div class="lgRow"><span class="dot pinMini" style="--c:#E9A319"></span>還沒去</div>
              </div>
      <div id="todoGeo" class="hide"></div>
    </section>
    <section id="listView" class="hide">
      <div class="inner">
        <input id="q" type="search" placeholder="搜尋店名或心得…" aria-label="搜尋">
        <div class="chips" id="bmChips"></div>
        <div id="cards"></div>
        <div id="listEmpty"></div>
      </div>
    </section>
  </main>

  <button id="fab">
    <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M32 6C20.4 6 11 15.2 11 26.6 11 41.8 32 60 32 60s21-18.2 21-33.4C53 15.2 43.6 6 32 6z" fill="currentColor"/></svg>
    釘一個
  </button>
</div>

<!-- ============ 新增 / 編輯 圖釘 ============ -->
<div class="overlay hide" id="pinOverlay">
  <div class="sheet" role="dialog" aria-modal="true" aria-label="新增圖釘">
    <div class="sheetHead">
      <h2 id="pinTitle">釘一個新地方</h2>
      <button class="xBtn" id="pinClose" aria-label="關閉">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <input type="file" id="importFile" accept=".json,application/json" class="hide">

    <label class="lb" for="fName">店名 / 地點名稱</label>
      <span class="fieldWrap"><input class="txt" id="fName" type="text" placeholder="例如：OO 燒肉"><button type="button" class="clrBtn" data-clr="fName" aria-label="清空店名">×</button></span>

      <label class="lb" for="fAddr">地址（自動帶入，可改可留空）</label>
      <span class="fieldWrap"><input class="txt" id="fAddr" type="text" placeholder="例如：OO 縣 OO 區 OO 路 100 號"><button type="button" class="clrBtn" data-clr="fAddr" aria-label="清空地址">×</button></span>

      <label class="lb" for="fIntro">簡介（貼文帶入，或自己寫店家介紹）</label>
      <span class="fieldWrap"><textarea class="txt" id="fIntro" style="min-height:64px" placeholder="例如：店家特色、菜單重點、營業時間…"></textarea><button type="button" class="clrBtn clrTa" data-clr="fIntro" aria-label="清空簡介">×</button></span>

      <label class="lb">分類</label>
      <div class="catChips" id="fCats"></div>

      <label class="lb">書籤（選填；點一下選、再點一下取消）</label>
      <div class="catChips" id="fFolderChips"></div>

      <label class="lb">狀態</label>
      <div class="segRow" id="fStatus">
        <button data-v="todo" class="on">還沒去</button>
        <button data-v="done">去過了</button>
      </div>

      <div id="doneExtra">
        <label class="lb">味道如何？喜歡程度</label>
        <div class="heartPick" id="fRating"></div>

        <label class="lb" for="fPrice">價位</label>
        <div class="inRow">
          <select class="txt" id="fPrice">
            <option value="">不記</option><option value="$">$ 銅板價</option>
            <option value="$$">$$ 中價位</option><option value="$$$">$$$ 小奢華</option><option value="__custom">自訂…</option>
          </select>
        <div id="priceCustomWrap" class="hide" style="margin-top:8px">
          <input class="txt" id="fPriceCustom" type="text" placeholder="自己寫：例如「人均 250」「拉麵 99 起」">
        </div>
        </div>
      </div>

      <label class="lb" for="fNote">心得 / 註記</label>
      <textarea class="txt" id="fNote" placeholder="例如：氛圍不錯、XX 必點，下次想再試 OO…"></textarea>

      <label class="lb" for="fUrl">網址（選填，純紀錄用，不會解析）</label>
      <input class="txt" id="fUrl" type="url" placeholder="https://…">

      <label class="lb">小筆記本（加分頁，最多 3 頁；點圖釘可翻頁看）</label>
      <div id="pagesBox"></div>
      <button type="button" class="miniBtn" id="addPageBtn" style="margin-top:6px">＋ 新增一頁</button>

      <div class="switchRow">
        <div class="t"><b>公開這一筆</b><span>公開的釘子會出現在你的分享地圖上；私人只有自己看得到。</span></div>
        <div class="switch">
          <input type="checkbox" id="fPub" aria-label="公開">
          <span class="track"></span><span class="knob"></span>
        </div>
      </div>

      <button class="saveBtn" id="saveBtn">釘起來</button>
      <button class="delBtn hide" id="delBtn">刪除這筆紀錄</button>
      <button class="delBtn hide" id="sharePinBtn" style="background:#EEF3E8;color:#4C6B3C">📤 分享給朋友</button>

  </div>
</div>

<!-- ============ 分享 ============ -->
<div class="overlay hide" id="shareOverlay">
  <div class="sheet" role="dialog" aria-modal="true" aria-label="分享">
    <div class="sheetHead">
      <h2>分享我的地圖</h2>
      <button class="xBtn" id="shareClose" aria-label="關閉">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <p style="font-size:14.5px;line-height:1.8;color:var(--ink2)">把連結傳給朋友，對方會看到一頁<b style="color:var(--ink)">唯讀地圖</b>。只有你設為「公開」的店會出現在這份分享地圖上。</p>
    <div class="shareUrl" id="shareUrl">請先開啟分享</div>
    <div class="ceBtns"><button type="button" class="primary" id="shareOn">開啟分享</button><button type="button" id="copyShare">複製連結</button></div>
    <div style="font-size:11.5px;color:#8A8674;margin-top:8px;text-align:left">分享開著時，別人打開網址就能看；你關閉分享後，舊網址會立即失效。</div>
  </div>
</div>

<!-- ============ 管理分類與顏色 ============ -->
<div class="overlay hide" id="colorOverlay">
  <div class="sheet" role="dialog" aria-modal="true" aria-label="管理分類與顏色">
    <div class="sheetHead">
      <h2>管理分類與顏色</h2>
      <button class="xBtn" id="colorClose" aria-label="關閉">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <label class="lb">圖釘顏色要跟著什麼走？</label>
    <div class="segRow" id="colorModeSeg">
      <button data-v="cat" class="on">分類顏色</button>
      <button data-v="status" style="display:none">去過 / 沒去過</button>
    </div>
    <label class="lb">狀態顏色（圖釘外圈用這兩色；清單徽章也會跟著變）</label>
    <div class="cmRow" id="stRow-done"></div>
    <div class="cmRow" id="stRow-todo"></div>
    <label class="lb">分類顏色（點色塊直接改；每個分類都能改名、刪除，刪掉的釘子會移到未分類）</label>
    <div id="catManager"></div>
    <div class="cmRow" style="border-bottom:none">
      <input class="txt" id="newCatName" placeholder="新分類名稱，例如：夜市" style="flex:1">
      <button class="cmBtn" id="addCatBtn" style="padding:10px 15px;white-space:nowrap">新增分類</button>
      <button class="cmBtn" id="resetCats" style="padding:10px 15px;white-space:nowrap">還原預設</button>
    </div>
  </div>
</div>

<div id="toast" role="status"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
.pinwrap{background:none;border:none}
.pin{position:relative;width:24px;height:24px;background:var(--c);border:2.5px solid #fff;border-radius:50% 50% 50% 0;transform:rotate(-45deg);box-shadow:0 3px 8px rgba(0,0,0,.35);cursor:pointer;appearance:none;-webkit-appearance:none;padding:0}
.pin::after{content:'';position:absolute;left:7px;top:7px;width:8px;height:8px;border-radius:50%;background:var(--cc,#fff);border:1.5px solid rgba(255,255,255,.9)}
.pp .pp-foot{flex-wrap:wrap}
</style>
<script>
(function(){
"use strict";
var $=function(s){return document.querySelector(s)};
var $$=function(s){return Array.prototype.slice.call(document.querySelectorAll(s))};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(m){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]})}
var escAttr=esc;

var BASE_CATS=[
 {id:'food',name:'美食',color:'#E2452C'},
 {id:'coffee',name:'咖啡',color:'#8A5A3B'},
 {id:'spot',name:'景點',color:'#1F7A6B'},
 {id:'craft',name:'手作',color:'#7458B5'},
 {id:'shop',name:'購物',color:'#3168B0'},
 {id:'na',name:'未分類',color:'#8C9186'}

function makeChipsSmart(box,kind){
  if(!box||box.dataset.smart)return;
  box.dataset.smart='1';
  var pr=null,suppress=false;
  box.addEventListener('click',function(e){if(suppress){suppress=false;e.preventDefault();e.stopPropagation()}},true);
  box.addEventListener('contextmenu',function(e){e.preventDefault()});
  function localId(chip){return kind==='folder'?(chip.dataset.f||chip.dataset.id):chip.dataset.id}
  function end(){
    if(!pr)return;
    clearTimeout(pr.t);
    pr.chip.classList.remove('armed');
    window.removeEventListener('pointermove',move);
    window.removeEventListener('pointerup',up);
    window.removeEventListener('pointercancel',up);
    pr=null;
  }
  function move(e){
    if(!pr)return;
    var dx=e.clientX-pr.x,dy=e.clientY-pr.y,d=Math.sqrt(dx*dx+dy*dy);
    if(!pr.armed){if(d>10)end();return}
    e.preventDefault();
    if(!pr.drag){if(d<8)return;pr.drag=true;pr.chip.classList.add('dragging');suppress=true}
    var addChip=box.querySelector('#bmAddBtn,[data-add]');
    var sibs=[].slice.call(box.querySelectorAll('.chip,.catChip')).filter(function(x){return x!==pr.chip&&!x.dataset.add&&x.id!=='bmAddBtn'&&localId(x)});
    var placed=false;
    for(var i=0;i<sibs.length;i++){
      var r=sibs[i].getBoundingClientRect();
      if(e.clientX<r.left+r.width/2){box.insertBefore(pr.chip,sibs[i]);placed=true;break}
    }
    if(!placed){if(addChip)box.insertBefore(pr.chip,addChip);else box.appendChild(pr.chip)}
  }
  function up(){
    if(!pr)return;
    var wasDrag=pr.drag,wasArmed=pr.armed,chip=pr.chip;
    end();
    if(wasDrag){commit();return}
    if(wasArmed){suppress=true;setTimeout(function(){suppress=false;openChipEditor(kind,localId(chip))},0)}
  }
  function commit(){
    suppress=true;setTimeout(function(){suppress=false},450);
    var ids=[].slice.call(box.querySelectorAll('.chip,.catChip')).map(localId).filter(Boolean);
    if(kind==='folder'){
      var map={};S.folders.forEach(function(f){map[f.id]=f});
      var next=ids.filter(function(i){return map[i]}).map(function(i){return map[i]});
      S.folders.forEach(function(f){if(next.indexOf(f)<0)next.push(f)});
      S.folders=next;persist();renderAll();renderFolderChips();
    }else{
      S.catOrder=ids.concat((S.catOrder||[]).filter(function(x){return ids.indexOf(x)<0}));
      catAll().forEach(function(cc){if(S.catOrder.indexOf(cc.id)<0)S.catOrder.push(cc.id)});
      persist();renderAll();
      var onc=document.querySelector('#fCats .catChip.on');
      renderCatChips(onc?onc.dataset.id:undefined);
    }
    toast('順序已更新');
  }
  box.addEventListener('pointerdown',function(e){
    if(pr||e.button>0)return;
    var chip=e.target.closest('.chip,.catChip');if(!chip)return;
    if(chip.id==='bmAddBtn'||chip.dataset.add)return;
    if(e.target.closest('.bmDel'))return;
    if(!localId(chip))return;
    suppress=false;
    pr={chip:chip,x:e.clientX,y:e.clientY,armed:false,drag:false,t:0};
    pr.t=setTimeout(function(){if(!pr)return;pr.armed=true;pr.chip.classList.add('armed')},430);
    window.addEventListener('pointermove',move,{passive:false});
    window.addEventListener('pointerup',up);
    window.addEventListener('pointercancel',up);
  });
}

function dedupeFolders(){
  if(!Array.isArray(S.folders))S.folders=[];
  var seen={},keep=[],map={};
  S.folders.forEach(function(f){
    if(!f||!f.id)return;
    var k=(f.name||'').trim();
    if(k&&seen[k]){map[f.id]=seen[k]}
    else{if(k)seen[k]=f.id;keep.push(f)}
  });
  if(keep.length!==S.folders.length){
    S.pins.forEach(function(p){if(p.folder&&map[p.folder])p.folder=map[p.folder]});
    S.folders=keep;persist();
  }
}

function parseMapsCoords(u){
  var m=u.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/);
  if(m)return{lat:+m[1],lng:+m[2]};
  m=u.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/);
  if(m)return{lat:+m[1],lng:+m[2]};
  m=u.match(/[?&](?:q|query|destination|center)=(-?\d+\.\d+)(?:%2C|,)(-?\d+\.\d+)/i);
  if(m)return{lat:+m[1],lng:+m[2]};
  return null;
}
function parseMapsName(u){

function driveGet(tok,id){return gfetch('https://www.googleapis.com/drive/v3/files/'+id+'?alt=media',{headers:{Authorization:'Bearer '+tok}}).then(function(r){return r.json()})}
function driveSave(tok,id,payload){
  if(id)return gfetch('https://www.googleapis.com/upload/drive/v3/files/'+id+'?uploadType=media',{method:'PATCH',headers:{Authorization:'Bearer '+tok,'Content-Type':'application/json'},body:JSON.stringify(payload)}).then(function(r){return r.json()});
  var fd=new FormData();
  fd.append('metadata',new Blob([JSON.stringify({name:'pocket-pins-data.json',parents:['appDataFolder']})],{type:'application/json'}));
  fd.append('file',new Blob([JSON.stringify(payload)],{type:'application/json'}));
  return gfetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',{method:'POST',headers:{Authorization:'Bearer '+tok},body:fd}).then(function(r){return r.json()});
}
function doPush(tok){
  setSync('syncing');
  var d=stateData();if(d.user){delete d.user.tok;delete d.user.rtok}
  var payload={savedAt:Date.now(),data:d};
  var pre=cloudFid?Promise.resolve({files:[{id:cloudFid}]}):driveList(tok);
  pre.then(function(gl){
    var f=gl&&gl.files&&gl.files[0];if(f)cloudFid=f.id;
    return driveSave(tok,f?f.id:null,payload);
  }).then(function(){localStorage.removeItem(KEY+'_lastSyncErr');localStorage.setItem(KEY+'_savedAt',String(Date.now()));setSync('ok',new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'}))})
  .catch(function(e){var m=(e&&e.auth)?'auth':String((e&&e.message)||e||'unknown');localStorage.setItem(KEY+'_lastSyncErr',m);if(e&&e.auth){autoReconnect()||authTip();return}setSync('err')});
}
function queuePush(){
  if(typeof FB!=='undefined'&&FB.ready)return; /* v67：Firebase 接手，舊 Google 上傳停駛 */
  if(!S.user||pulling)return;
  clearTimeout(pushTimer);
  pushTimer=setTimeout(function(){
    if(pulling)return;
    var go=function(tk){if(tk)doPush(tk)};
    if(S.user.tok)go(S.user.tok);
    else if(S.user.rtok)tryRefresh().then(go).catch(function(){autoReconnect()||authTip()});
    else autoReconnect();
  },1000);
}
function syncPull(tok){
  if(typeof FB!=='undefined'&&FB.ready)return; /* v67：Firebase 接手，舊 Google 同步停駛 */
  setSync('syncing');
  driveList(tok).then(function(gl){
    var f=gl&&gl.files&&gl.files[0];if(f)cloudFid=f.id;
    if(!f){doPush(tok);return}
    return driveGet(tok,f.id).then(function(cloud){
      if(!cloud||!cloud.data||!Array.isArray(cloud.data.pins)){doPush(tok);return}
      pulling=true;
      var merged=stateData();
      var byId={};
      (merged.pins||[]).forEach(function(p){byId[p.id]=p});
      (cloud.data.pins||[]).forEach(function(p){var o=byId[p.id];if(!o||((+(p.updated||p.created||0))>(+(o.updated||o.created||0))))byId[p.id]=p});
      merged.pins=Object.keys(byId).map(function(k){return byId[k]});
      var cc={};(merged.customCats||[]).forEach(function(c){cc[c.id]=c});(cloud.data.customCats||[]).forEach(function(c){cc[c.id]=c});
      merged.customCats=Object.keys(cc).map(function(k){return cc[k]});
      applyState(merged);persist();
      renderAll();renderFolderChips();renderCatChips();
      pulling=false;
      doPush(tok);
      setSync('ok',new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'}));
      toast('已同步：共 '+merged.pins.length+' 家店（兩台合併，不會互相覆蓋）');
    });
  }).catch(function(e){if(e&&e.auth){autoReconnect()||authTip();return}setSync('err')});
}

function exportBackup(){
  var d=new Date(),pad=function(n){return (n<10?'0':'')+n};
  var name='口袋地圖備份-'+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'-'+pad(d.getHours())+pad(d.getMinutes())+'.json';
  var a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(stateData(),null,1)],{type:'application/json'}));
  a.download=name;document.body.appendChild(a);a.click();a.remove();
  toast('備份檔已下載：'+name);
}
function importBackup(file){
  var rd=new FileReader();
  rd.onload=function(){
    try{
      var d=JSON.parse(rd.result);
      if(!d||!Array.isArray(d.pins))throw new Error('bad');
      if(!window.confirm('還原會覆蓋目前全部資料（現在 '+S.pins.length+' 家 → 備份檔 '+d.pins.length+' 家），確定？'))return;
      applyState(d);persist();renderAll();renderFolderChips();renderCatChips();
      renderAvatar();
      toast('已還原 '+S.pins.length+' 家店');
    }catch(e){toast('備份檔讀取失敗（格式不對？）')}
  };
  rd.readAsText(file);
}

/* v67：雲端為準，整包套用 — 刪除、改名、顏色、分類增減全部同步 */
function fbApply(d,silent){
  FB.applying=true;
  try{
    var dd=JSON.parse(JSON.stringify(d));delete dd._t;delete dd.user;
    /* Firebase 會把空陣列整個刪欄位 — 沒有就補空陣列，否則本機永遠清不掉 */
    if(!Array.isArray(dd.pins))dd.pins=[];
    if(!Array.isArray(dd.customCats))dd.customCats=[];
    if(!Array.isArray(dd.folders))dd.folders=[];
    if(!Array.isArray(dd.catOrder))dd.catOrder=[];
    if(!dd.trash)dd.trash={};
    if(!dd.catColors)dd.catColors={};
    if(!dd.catNames)dd.catNames={};
    if(!dd.hiddenCats)dd.hiddenCats=[];
    if(!dd.statusColors)dd.statusColors={};
    var inTrash=dd.trash;
    dd.pins=dd.pins.filter(function(p){ /* 墓碑過濾：雲端記錄過「已刪」的店，一律不留 */
      if(inTrash[p.id]&&inTrash[p.id]>=(+(p.updated||p.created||0)))return false;
      return true;
    });
    applyState(dd);
    FB.lastPushed=JSON.stringify((function(){var x=stateData();delete x.user;return x})());
    FB.lastT=+(d._t||Date.now());
    try{localStorage.setItem(localScopeKey(),JSON.stringify(stateData()));scopedSet('_savedAt',String(Date.now()))}catch(e){}

    renderAll();renderFolderChips();renderCatChips(S.draftCat);
    if(!silent)toast('雲端已同步更新');
  }finally{FB.applying=false}
  setTimeout(function(){if(FB.ready)fbPush()},500);
}
function fbListen(){
  if(!FB.ready||!AUTH.user)return;
  if(FB.ref)FB.ref.off();
  FB.ref=FB.db.ref(fbPath());
  FB.ref.on('value',function(s){
    var d=s.val();if(!d||FB.applying)return;
    if(d._t&&FB.lastT&&d._t<=FB.lastT)return;
    var j=JSON.stringify((function(){var x=JSON.parse(JSON.stringify(d));delete x._t;delete x.user;return x})());
    if(j===FB.lastPushed){FB.lastT=+(d._t||0);return}
    fbApply(d);
  },function(e){toast('雲端連線失敗：'+(e&&e.message||e))});
}
function fbStart(){
  if(!FB.ready||!AUTH.user)return;
  FB.db.ref(fbPath()).once('value').then(function(s){
    var d=s.val();
    if(d){
      var ct=+(d._t||0);var cids={};(d.pins||[]).forEach(function(p){cids[p.id]=1});
      var local=(S.pins||[]).filter(function(p){return !cids[p.id]&&(+(p.created||0))>ct});
      var oldTrash=S.trash||{};
      fbApply(d,true);
      /* 本機離線期間新釘的店（且沒被刪過）補回來 */
      local=local.filter(function(p){return !(S.trash&&S.trash[p.id])});
      if(local.length){S.pins=S.pins.concat(local);    try{localStorage.setItem(localScopeKey(),JSON.stringify(stateData()))}catch(e){}
}
    }
    fbPush();fbListen();
  }).catch(function(){fbPush();fbListen()});
}

function wsUpsertRoom(room){
  var rooms=wsRooms(),hit=false;
  rooms=rooms.map(function(r){if(r.code!==room.code)return r;hit=true;var x={};Object.keys(r).forEach(function(k){x[k]=r[k]});Object.keys(room).forEach(function(k){x[k]=room[k]});return x});
  if(!hit)rooms.push(room);
  wsSaveRooms(rooms);
  return rooms;
}

function wsRefreshRoomInfo(code,done){

    var patch={code:code,membersCount:Object.keys(members).length||0};
    if(meta.name)patch.name=meta.name;
    if(meta.creator){patch.creator=meta.creator;patch.role=(meta.creator===AUTH.user.uid)?'owner':'member'}
    wsUpsertRoom((function(){var x={};Object.keys(old).forEach(function(k){x[k]=old[k]});Object.keys(patch).forEach(function(k){x[k]=patch[k]});return x})());
    if(done)done();
  }).catch(function(){if(done)done()});
}

    +'<div class="ceBtns"><button type="button" id="wsRenameCancel">取消</button><button type="button" class="primary" id="wsRenameOk">儲存</button></div></div>';
  document.body.appendChild(ov);
  document.getElementById('wsRenameCancel').addEventListener('click',function(){ov.remove();if(onDone)onDone()});
  document.getElementById('wsRenameOk').addEventListener('click',function(){
    var nm=(document.getElementById('wsRenameTxt').value||'').trim();
    wsUpsertRoom({code:code,name:nm});
    var next=function(){ov.remove();if(onDone)onDone();toast('地圖名稱已更新')};
    if(FB.db&&AUTH.user)FB.db.ref('shared/'+code+'/__meta').update({name:nm||('共用地圖')}).then(next).catch(function(e){toast('改名失敗：'+((e&&e.message)||e))});
    else next();
  });
}
function wsQuickAdd(onDone){
  var rooms=wsRooms();
  if(rooms.length>=5){toast('共用地圖最多 5 個 — 刪掉一個才能再加');return}
  var ov=document.createElement('div');ov.id='chipEditOverlay';
  var mode='create',nameTxt='',joinCode='',createCode=fbNewCode(8);
  function render(){
    if(!AUTH.user){
      ov.innerHTML='<div class="ceCard"><h4>新增 / 加入共用地圖</h4>'
        +'<div style="font-size:12.5px;line-height:1.75;color:var(--ink2);text-align:left">先用 Google 登入，才可以建立自己的共用地圖，或輸入朋友給你的邀請碼加入。</div>'
        +'<button type="button" id="wsLoginFirst" class="primary" style="width:100%;margin-top:12px">先登入 Google</button>'
        +'<div class="ceBtns"><button type="button" id="wsAddCancel">取消</button></div></div>';
      document.getElementById('wsAddCancel').addEventListener('click',function(){ov.remove();if(onDone)onDone()});
      document.getElementById('wsLoginFirst').addEventListener('click',function(){ov.remove();acctUI()});
      return;
    }
    var createOn=mode==='create',joinOn=!createOn;

      +'<div style="display:flex;gap:8px;margin-top:4px">'
      +'<button type="button" id="wsModeCreate" style="flex:1;padding:10px;border-radius:10px;border:1.5px solid '+(createOn?'var(--ink)':'var(--line)')+';background:'+(createOn?'var(--ink)':'#fff')+';color:'+(createOn?'#fff':'var(--ink)')+'">自己創一張</button>'
      +'<button type="button" id="wsModeJoin" style="flex:1;padding:10px;border-radius:10px;border:1.5px solid '+(joinOn?'var(--ink)':'var(--line)')+';background:'+(joinOn?'var(--ink)':'#fff')+';color:'+(joinOn?'#fff':'var(--ink)')+'">加入朋友的</button>'
      +'</div>'
      +'<div style="font-size:12px;color:var(--ink2);text-align:left;margin-top:12px">'+(createOn?'地圖名稱':'你這邊顯示的地圖名稱（可留空）')+'</div>'
      +'<input class="txt" id="wsDlgName" maxlength="6" placeholder="例如：跟阿嬌的" value="'+escAttr(nameTxt)+'" style="width:100%;margin-top:6px;font-size:16px">'
      +'<div style="font-size:12px;color:var(--ink2);text-align:left;margin-top:10px">'+(createOn?'邀請碼（建立後傳給朋友）':'輸入朋友給你的邀請碼')+'</div>'
      +(createOn
        ?'<div style="display:flex;gap:6px;margin-top:6px"><input class="txt" id="wsDlgCode" value="'+escAttr(createCode)+'" readonly style="flex:1;font-weight:900;letter-spacing:2px;text-transform:uppercase"><button type="button" id="wsCopyCode">複製</button></div><div style="font-size:11.5px;color:#8A8674;margin-top:6px;text-align:left">完成後你先看到這張地圖，狀態會顯示「等待朋友加入」。</div>'
        :'<input class="txt" id="wsDlgCode" maxlength="8" placeholder="輸入 8 碼邀請碼" value="'+escAttr(joinCode)+'" style="width:100%;margin-top:6px;font-size:16px;text-transform:uppercase"><div style="font-size:11.5px;color:#8A8674;margin-top:6px;text-align:left">朋友建立後把邀請碼傳給你；你輸入完成就會加入同一張地圖。</div>')
      +'<div class="ceBtns"><button type="button" id="wsAddCancel">取消</button><button type="button" class="primary" id="wsDoDone">'+(createOn?'完成並建立':'完成並加入')+'</button></div></div>';
    document.getElementById('wsModeCreate').addEventListener('click',function(){nameTxt=(document.getElementById('wsDlgName').value||'').trim();mode='create';render()});
    document.getElementById('wsModeJoin').addEventListener('click',function(){nameTxt=(document.getElementById('wsDlgName').value||'').trim();joinCode='';mode='join';render()});
    document.getElementById('wsAddCancel').addEventListener('click',function(){ov.remove();if(onDone)onDone()});
    var copyBtn=document.getElementById('wsCopyCode');
    if(copyBtn)copyBtn.addEventListener('click',function(){if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(createCode).then(function(){toast('邀請碼已複製')},function(){toast('複製失敗，請手動選取')})});
    document.getElementById('wsDoDone').addEventListener('click',function(){
      nameTxt=(document.getElementById('wsDlgName').value||'').trim();
      var btn=this;btn.disabled=true;
      if(mode==='create'){
        var code=createCode,roomName=nameTxt||('共用地圖 '+(wsRooms().length+1));
        var payload={'__meta':{name:roomName,creator:AUTH.user.uid,created:Date.now()}};payload['members/'+AUTH.user.uid]=true;
        FB.db.ref('shared/'+code).update(payload).then(function(){
          wsUpsertRoom({code:code,name:roomName,role:'owner',creator:AUTH.user.uid,membersCount:1});
          wsSwitch(code,function(){wsRefreshRoomInfo(code,function(){ov.remove();if(onDone)onDone();toast('共用地圖已建立 — 把邀請碼傳給朋友就能一起用')})});
        }).catch(function(e){btn.disabled=false;toast('建立共用地圖失敗：'+((e&&e.message)||e))});
      }else{
        var code=(document.getElementById('wsDlgCode').value||'').trim().toUpperCase();
        if(code.length<8){btn.disabled=false;toast('邀請碼是 8 碼 — 跟朋友再確認一下');return}
        if(wsRooms().some(function(r){return r.code===code})){btn.disabled=false;toast('你已經有這個共用地圖了');return}
        FB.db.ref('shared/'+code+'/__meta').once('value').then(function(s){
          var meta=s.val();
          if(!meta){btn.disabled=false;toast('找不到這組邀請碼，請再確認一次');return}
          wsSwitch(code,function(){
            wsUpsertRoom({code:code,name:nameTxt||meta.name||'',role:'member',creator:meta.creator||'',membersCount:0});
            wsRefreshRoomInfo(code,function(){ov.remove();if(onDone)onDone();toast('已加入共用地圖')});
          });
        }).catch(function(e){btn.disabled=false;toast('加入共用地圖失敗：'+((e&&e.message)||e))});
      }
    });
  }
  document.body.appendChild(ov);
  ov.addEventListener('click',function(e){if(e.target===ov){ov.remove();if(onDone)onDone()}});
  render();
}
function sharedUI(){
  var ov=document.createElement('div');ov.id='chipEditOverlay';
  var hydrated=false;
  function render(skipHydrate){
    if(!AUTH.user){
      ov.innerHTML='<div class="ceCard"><h4>共用地圖</h4>'
        +'<div style="font-size:12.5px;line-height:1.75;color:var(--ink2);text-align:left">先用 Google 登入，才可以自己建立共用地圖，或輸入朋友給你的邀請碼加入。</div>'
        +'<button type="button" id="wsNeedLogin" class="primary" style="width:100%;margin-top:12px">先登入 Google</button>'
        +'<div class="ceBtns"><button type="button" id="wsClose">關閉</button></div></div>';
      document.getElementById('wsClose').addEventListener('click',function(){ov.remove()});
      document.getElementById('wsNeedLogin').addEventListener('click',function(){ov.remove();acctUI()});
      return;
    }
    var rooms=wsRooms();
    var h='<div class="ceCard"><h4>共用地圖</h4>';
    h+='<div style="font-size:12px;color:var(--ink2);text-align:left;margin-bottom:8px">這裡只放你的共用地圖；需要時再按頭像旁邊的 ＋ 建立或加入。</div>';
    h+='<div style="max-height:38vh;overflow:auto;text-align:left;margin-top:8px">';
    if(!rooms.length)h+='<div style="font-size:12.5px;color:var(--ink2);padding:10px 0">目前還沒有共用地圖；有人要一起用時再按 ＋ 就好。</div>';
    rooms.forEach(function(rm,i){
      var cur=S.sharedRoom===rm.code;
      var nm=wsDefaultRoomName(rm,i);
      var fs=nm.length<=4?15:(nm.length<=5?14:13);
      var act=(rm.role==='owner')?'刪除':'退出';
      h+='<div style="display:flex;gap:6px;align-items:center;margin:4px 0"><button type="button" class="suggRow" data-ws="'+rm.code+'" style="flex:1;justify-content:flex-start;min-width:0'+(cur?';outline:2px solid #7B9E6B':'')+'"><span>👥</span><span style="text-align:left;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"><b style="font-size:'+fs+'px">'+esc(nm)+'</b><small style="color:var(--ink2)">'+(cur?'✅ ':'')+esc(wsRoomStatus(rm))+' · '+escAttr(rm.code)+'</small></span></button><div style="display:flex;flex-direction:column;gap:4px"><button type="button" data-wsrename="'+rm.code+'" style="padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:12px">改名</button><button type="button" class="danger" data-wsact="'+rm.code+'" style="padding:6px 8px">'+act+'</button></div></div>';
    });
    h+='</div>';
    if(S.sharedRoom){
      h+='<div style="font-size:12px;color:var(--ink2);text-align:left;margin-top:8px">目前這張共用地圖的邀請碼：</div>'
        +'<div style="display:flex;gap:6px;margin-top:4px"><input class="txt" id="wsCurCode" value="'+escAttr(S.sharedRoom)+'" readonly style="flex:1;font-weight:900;letter-spacing:2px;text-transform:uppercase"><button type="button" id="wsCurCopy">複製</button></div>';
    }
    if(rooms.length>=5)h+='<div style="font-size:12px;color:#8A8674;margin-top:8px;text-align:center">已達上限 5 個 — 刪掉一個才能再加</div>';
    h+='<div class="ceBtns"><button type="button" id="wsClose">關閉</button></div>';
    h+='<div style="font-size:11.5px;color:#8A8674;margin-top:6px;text-align:left">這裡只用來切換、改名、刪除或退出共用地圖；要新增或加入請按頭像旁邊的 ＋。</div></div>';
    ov.innerHTML=h;
    document.getElementById('wsClose').addEventListener('click',function(){ov.remove()});
    var ccb=document.getElementById('wsCurCopy');
    if(ccb)ccb.addEventListener('click',function(){if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(S.sharedRoom).then(function(){toast('邀請碼已複製')},function(){toast('複製失敗，請手動選取')})});
    ov.querySelectorAll('[data-ws]').forEach(function(b){b.addEventListener('click',function(){var c=b.dataset.ws;if(S.sharedRoom===c){toast('已經在使用這個共用地圖');return}wsSwitch(c,function(){hydrated=false;render()})})});
    ov.querySelectorAll('[data-wsrename]').forEach(function(b){b.addEventListener('click',function(){var code=b.dataset.wsrename;ov.remove();wsRenamePrompt(code,function(){sharedUI()})})});
    ov.querySelectorAll('[data-wsact]').forEach(function(b){b.addEventListener('click',function(){
      var code=b.dataset.wsact,rm=wsRoomObj(code);if(!rm||!AUTH.user)return;
      if(rm.role==='owner'){
        if(!window.confirm('刪除後，這張共用地圖會從所有人那邊一起消失，確定？'))return;
        FB.db.ref('shared/'+code).remove().then(function(){
          wsRemoveRoom(code);
          if(S.sharedRoom===code)wsSwitch('',function(){hydrated=false;render();toast('已刪除整張共用地圖')});
          else{hydrated=false;render();toast('已刪除整張共用地圖')}
        }).catch(function(e){toast('刪除失敗：'+((e&&e.message)||e))});
      }else{
        if(!window.confirm('退出後，你這邊會移除這張共用地圖，確定？'))return;
        FB.db.ref('shared/'+code+'/members/'+AUTH.user.uid).remove().then(function(){
          wsRemoveRoom(code);
          if(S.sharedRoom===code)wsSwitch('',function(){hydrated=false;render();toast('已退出這張共用地圖')});
          else{hydrated=false;render();toast('已退出這張共用地圖')}
        }).catch(function(e){toast('退出失敗：'+((e&&e.message)||e))});
      }
    })});
    if(!skipHydrate&&!hydrated){hydrated=true;wsHydrateRooms(function(){if(document.body.contains(ov))render(true)})}
  }
  document.body.appendChild(ov);
  render();
}
function pinImportFromHash(){
  var mv=location.hash.match(/#view=([A-Za-z0-9]+)/);
  if(mv){try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}showViewer(mv[1]);return}
  var m=location.hash.match(/#add=([A-Za-z0-9\-_]+)/);if(!m)return;
  try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}
  var j=null;try{j=JSON.parse(decodeURIComponent(escape(atob(m[1].replace(/-/g,'+').replace(/_/g,'/')))))}catch(e){}
  if(!j||(!j.n&&!j.a&&j.lat==null))return;
  setTimeout(function(){
    openPin(null);
    if(j.n)$('#fName').value=j.n;
    if(j.a)$('#fAddr').value=cleanAddr(j.a);
    if(j.lat!=null&&j.lng!=null)S.draft={lat:+j.lat,lng:+j.lng};
    if(j.note)$('#fNote').value=j.note;
    if(j.c){S.draftCat=j.c;renderCatChips(j.c)}
    updateCoordTxt();
    toast('朋友的推薦已幫你填好 — 確認後按「釘起來」');
  },700);
}
